plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mqttbroker'
version = '0.7.9'

android {
  namespace "expo.modules.mqttbroker"
  defaultConfig {
    versionCode 1
    versionName "0.7.9"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "io.moquette:moquette-broker:0.16"
}
